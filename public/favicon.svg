<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Paper background with soft rounded corners -->
  <rect width="64" height="64" rx="10" fill="#f8f6f1"/>

  <!-- Letter "d": bowl + stem, matching the site's fine-line ink -->
  <circle cx="24" cy="40" r="13"
    stroke="#4d4740" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="37" y1="12" x2="37" y2="53"
    stroke="#4d4740" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Tiny botanical accent (echoes the nav logo) -->
  <path d="M45 20 Q51 14 55 8"
    stroke="#4d4740" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <circle cx="55" cy="8" r="1.6"
    stroke="#4d4740" stroke-width="1.4" fill="none" opacity="0.45"/>
</svg>
